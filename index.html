<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Koçluk</title>
    <script>
      // React'in kendi tema mantığı (App.jsx) devreye girmeden ÖNCE, ilk boya (paint) sırasında
      // açık tema kullanıcısına koyu zemin göstermemek için (varsayılan koyu) — stil sayfası okunur
      // okunmaz senkron çalışır. Değer theme.js > THEMES.light.bg ile elle senkron tutulmalı.
      try {
        if (localStorage.getItem("kocluk-theme") === "light") {
          document.write('<style>body{background:#F4F5F7 !important}</style>');
        }
      } catch (_) {}
    </script>
    <link rel="icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: #0D1014;
        font-family: 'Space Grotesk', -apple-system, 'Segoe UI', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      ::selection { background: rgba(140,149,163,0.35); }

      /* Kaydırma çubuğu — varsayılan kalın/gri tarayıcı çubuğu yerine daha ince, sayfayla uyumlu. */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(140,149,163,0.28); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(140,149,163,0.45); background-clip: padding-box; }

      /* Inline style'larla ifade edilemeyen etkileşim durumları (:hover/:focus) burada toplanır —
         renk DEĞERLERİ src/theme.js > C ile elle senkron tutulmalı (paylaşılan bir kaynak yok). */
      .k-btn { transition: filter .12s ease, transform .05s ease, box-shadow .12s ease; }
      .k-btn:hover { filter: brightness(0.93); }
      .k-btn:active { transform: translateY(1px); }
      .k-btn:disabled { pointer-events: none; }

      .k-card-hover { transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease; }
      .k-card-hover:hover { border-color: var(--border-strong, #2C333C) !important; }

      .k-field { transition: border-color .12s ease, box-shadow .12s ease; }
      .k-field:focus { outline: none; border-color: var(--focus-color, #8C95A3) !important; box-shadow: 0 0 0 3px var(--focus-glow, rgba(140,149,163,0.18)); }
      /* Klavye odağı görünür olsun (koyu zeminde tarayıcı halkası kayboluyordu). */
      button:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--focus-color, #8C95A3); outline-offset: 2px; }

      /* Yalnızca ekran okuyucunun duyduğu metin (ör. alt menüdeki okunmamış sayısı). */
      .k-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      .k-list-row { transition: background-color .12s ease; }
      button.k-list-row:hover { background: var(--surface-hover, #20262E) !important; }
      /* Formun alta sabit aksiyon çubuğu (bkz. AssignmentCreateScreen) — masaüstünde sayfanın altına yapışır. */
      .k-sticky-action { position: sticky; bottom: 0; z-index: 20; }

      .k-sidebar-item { transition: background-color .12s ease, color .12s ease; }
      .k-sidebar-item:hover { background: rgba(255,255,255,0.07); }

      .k-icon-btn { transition: background-color .12s ease, border-color .12s ease, color .12s ease; }
      .k-icon-btn:hover { background: var(--surface-hover, #E9EBF4) !important; }

      .k-link-btn:hover { text-decoration: underline; }

      /* Ekran geçişi: yeni ekran hafifçe belirir — ani "zıplama" yerine. */
      @keyframes k-fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      /* "backwards": animasyon bitince öğede hiçbir animasyon değeri kalmaz — "both" ile son kare
         (transform/opacity) kalıcı uygulanıp yeni bir yığın bağlamı oluşturuyor, ekran içindeki
         pencereleri alt menünün altına itiyordu. */
      .k-screen { animation: k-fade-in .18s ease-out backwards; }

      /* İskelet yükleniyor kartları (bkz. common.jsx > LoadingState) — renkler inline, yalnızca kayma animasyonu burada. */
      @keyframes k-shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
      .k-skeleton { background-size: 400% 100% !important; animation: k-shimmer 1.4s ease-in-out infinite; }

      /* Pencereler: masaüstünde ortada kart, telefonda alttan açılan sayfa (bottom sheet) — başparmakla
         erişimi kolay, doğal mobil uygulama hissi. */
      @keyframes k-sheet-up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes k-backdrop-in { from { opacity: 0; } to { opacity: 1; } }
      .k-modal-backdrop { animation: k-backdrop-in .15s ease-out both; }
      .k-modal-panel { animation: k-sheet-up .2s cubic-bezier(0.16, 1, 0.3, 1) both; }

      /* Yatay kaydırılabilir çip satırı (tarih filtreleri vb.) — telefonda alt satıra kırılmak yerine kayar. */
      .k-chip-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
      .k-chip-row::-webkit-scrollbar { display: none; }
      .k-chip-row > * { flex-shrink: 0; }

      @media (prefers-reduced-motion: reduce) {
        .k-screen, .k-modal-backdrop, .k-modal-panel, .k-skeleton, .k-wing-left, .k-wing-right { animation: none !important; }
      }

      /* Kenar çubuğu dar ekranlarda simge-yalnız moda geçer — telefon/dar pencere yerine masaüstünde
         de pencere küçültüldüğünde metin taşmasın diye. */
      @media (max-width: 860px) {
        .k-sidebar { width: 76px !important; }
        .k-sidebar-label, .k-sidebar-brand-text, .k-sidebar-user-text { display: none !important; }
        .k-sidebar-item { justify-content: center !important; padding-left: 0 !important; padding-right: 0 !important; }
        /* Okunmamış bildirim sayısı simge-yalnız modda da görünmeli — sekme metniyle birlikte
           gizlenmek yerine simgenin sağ üst köşesine küçültülerek taşınır. */
        .k-sidebar-badge {
          position: absolute !important; top: 3px !important; right: 13px !important;
          margin-left: 0 !important; min-width: 16px !important; height: 16px !important;
          font-size: 9.5px !important; padding: 0 4px !important;
        }
        /* Avatar + çıkış düğmesi yan yana 76px'e sığmıyor (34+10+30+32 = 106px), düğme kırpılıyordu. */
        .k-sidebar-user {
          flex-direction: column !important; gap: 9px !important;
          padding-left: 6px !important; padding-right: 6px !important;
        }
      }
      /* Eşik 900'den 680'e indirildi: iPad (portrede en dar ~744px, iPad mini dahil) artık
         masaüstüyle aynı split-panel tanıtım düzenini görüyor — yalnızca telefon genişliğinde
         (iPhone dikey kilit, ~430px'e kadar) kompakt tek sütuna düşülüyor. */
      @media (max-width: 680px) {
        .k-login-brand { display: none !important; }
        /* Marka paneli gizlenince giriş ekranında hiç logo kalmıyordu — dar ekranda formun
           üstünde kompakt bir amblem gösterilir. */
        .k-login-mobile-brand { display: flex !important; }
        /* Dar ekranda içerik (logo + form) dikey ortalanmak yerine yukarı alınır — logo ekranın
           üst kısmında, parıltının (radial-gradient) tam merkezinde dursun diye. */
        .k-login-form-panel { align-items: flex-start !important; padding-top: 56px !important; }
      }

      /* Telefon genişliğinde (asıl kullanım — Android/iOS uygulaması bu genişlikte açılıyor) kenar
         çubuğu tamamen kaldırılıp yerine alt yatay menü konur; simge-yalnız dikey çubuk telefonda
         hem yer kaplıyor hem de dokunması dikey menülerden daha zahmetli. */
      @media (max-width: 640px) {
        .k-sidebar { display: none !important; }
        .k-bottom-nav { display: flex !important; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; }
        /* Alt menü 66px + 24px nefes — son kart menünün altında kalmasın. */
        .k-content-col { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 90px) !important; }
        /* Alt sabit eylem çubuğu olan ekran (sonuç girişi, öğrenci detayı...) — çubuk + menü kadar boşluk. */
        .k-content-col.k-has-action-bar { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 200px) !important; }
        /* Formun alta sabit aksiyon çubuğu telefonda alt menünün hemen üstünde durur. */
        .k-sticky-action { bottom: calc(env(safe-area-inset-bottom, 0px) + 66px) !important; margin-left: -18px !important; margin-right: -18px !important; }
        /* Klavye açıkken alt menü gizli — çubuk klavyenin hemen üstüne iner. */
        html.kb-open .k-sticky-action { bottom: 0 !important; }
        /* Sabit aksiyon çubuklu form sayfası: sayfa sonu ile çubuk arasında boş zemin kalmasın. */
        .k-page.k-page-form { padding-bottom: 0 !important; }
        /* Klavye açıkken (Keyboard resize:native görünümü küçültür) sabit alt menü klavyenin hemen
           üstüne binip odaktaki alanı örtüyordu — yazı yazılırken menüye zaten ihtiyaç yok. */
        html.kb-open .k-bottom-nav { display: none !important; }
        html.kb-open .k-content-col { padding-bottom: 0 !important; }

        /* Telefonda sayfa kenar boşlukları 18px (şartname). */
        .k-page { padding: 14px 18px 24px !important; }
        /* Tam genişlik liste satırları sayfa kenar boşluğunu aşıp ekranın iki ucuna uzanır. */
        .k-bleed { margin-left: -18px !important; margin-right: -18px !important; }
        .k-bleed > .k-list-row { padding-left: 18px !important; padding-right: 18px !important; }
        .k-page-header { padding: 16px 18px 4px !important; }

        /* Pencere telefonda alttan açılan sayfaya dönüşür. */
        .k-modal-backdrop { align-items: flex-end !important; padding: 0 !important; padding-top: env(safe-area-inset-top) !important; }
        .k-modal-panel {
          max-width: none !important; max-height: 92vh !important;
          border-radius: 20px 20px 0 0 !important;
          padding: 20px 18px calc(env(safe-area-inset-bottom, 0px) + 20px) !important;
        }
      }

      /* ==========================================================================
         iOS kabuğu (Capacitor). env(safe-area-inset-*) tarayıcıda 0 döndüğü için bu kuralların
         HİÇBİRİ web görünümünü değiştirmez — ayrı bir mobil yapı gerekmiyor.
         ========================================================================== */

      /* Durum çubuğunun altındaki şerit TEK renk olmalı: solda koyu kenar çubuğu, sağda beyaz
         başlık olsaydı saat ve pil simgeleri şeridin bir yarısında okunmaz kalırdı. Şerit beyaza
         boyanır, simgeler koyu yapılır (src/native/index.js > StatusBar.setStyle > Style.Light).
         z-index modalların (50) ÜSTÜNDE: modal arka planı şeridi karartsa simgeler yine okunmaz olurdu. */
      .k-app-root { padding-top: env(safe-area-inset-top); }
      .k-app-root::before {
        content: ""; position: fixed; top: 0; left: 0; right: 0;
        height: env(safe-area-inset-top); background: var(--status-strip-bg, #0D1014); z-index: 60; pointer-events: none;
      }

      /* Kenar çubuğu sticky/100vh — kök artık üstten dolgulu olduğu için ikisi de kaydırılmalı,
         yoksa çubuk ekranın altından taşar. */
      .k-sidebar {
        top: env(safe-area-inset-top) !important;
        height: calc(100vh - env(safe-area-inset-top)) !important;
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* Ana ekran çubuğunun (home indicator) içeriği örtmemesi için. */
      .k-content-col { padding-bottom: env(safe-area-inset-bottom); }
      /* Klavye açıkken ana ekran çubuğu zaten görünmüyor — alt boşluk iki kez uygulanmasın. */
      html.kb-open .k-content-col { padding-bottom: 0; }

      /* Giriş ekranı kök düzeni ayrı (kenar çubuğu yok) — güvenli alanlar orada da uygulanmalı. */
      .k-login-root {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* Dokunma davranışı: gri "tıklandı" parlaması ve uzun basınca çıkan sistem menüsü
         yalnızca ETKİLEŞİM öğelerinde kapatılır — metin seçme/kopyalama (ödev metni, geri dönüt)
         bilerek açık bırakılır. */
      body { -webkit-tap-highlight-color: transparent; }
      button, .k-sidebar, .k-btn, .k-icon-btn, .k-sidebar-item {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Sayfanın tamamının lastik gibi esnemesi (rubber-band) native hissi bozuyor; iç kaydırma
         alanları etkilenmez. */
      html, body { overscroll-behavior-y: none; }

      /* Giriş ekranı amblemi: aynı görselin sol/sağ yarısı ayrı ayrı klonlanıp (bkz. LoginScreen.jsx
         > AnimatedLogo) kendi kanadı yönünden (sol yarı soldan, sağ yarı sağdan) uçarak içeri girer —
         gerçek iki katmanlı bir "kanat açılışı" hissi versin diye, tek bir görseli kaydırmak yerine. */
      @keyframes k-wing-in-left {
        from { transform: translateX(-46px) rotate(-8deg); opacity: 0; }
        to { transform: translateX(0) rotate(0deg); opacity: 1; }
      }
      @keyframes k-wing-in-right {
        from { transform: translateX(46px) rotate(8deg); opacity: 0; }
        to { transform: translateX(0) rotate(0deg); opacity: 1; }
      }
      .k-wing-left { animation: k-wing-in-left 1.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .k-wing-right { animation: k-wing-in-right 1.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
